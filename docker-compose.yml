services:
  app:
    build: .
    container_name: logstream
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PGHOST=${PGHOST}
      - PGPORT=${PGPORT}
      - PGDATABASE=${PGDATABASE}
      - PGUSER=${PGUSER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - logstream-net

  db:
    image: postgres:16-alpine
    container_name: logstream-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${PGHOST}
      - POSTGRES_USER=${PGUSER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logstream -d logstream"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logstream-net
    # Uncomment to expose postgres directly (e.g. for pgAdmin access)
    # ports:
    #   - "5432:5432"

volumes:
  postgres-data:
    driver: local

networks:
  logstream-net:
    driver: bridge
